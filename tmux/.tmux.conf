# ==========================
# Базовые настройки
# ==========================

# Меняем префикс с Ctrl+b на Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Нумерация окон и панелей с 1 (вместо 0)
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Включаем поддержку мыши
set -g mouse on

# ==========================
# Интеграция с Helix и фиксы
# ==========================

# Убираем задержку при нажатии Escape
set -sg escape-time 0

# True color (RGB) поддержка
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Focus events (нужно для Helix)
set-option -g focus-events on

# ==========================
# Навигация и Сплиты
# ==========================

# Сплиты (открываются в текущей директории)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Навигация по панелям в стиле Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Быстрая перезагрузка конфига
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"
